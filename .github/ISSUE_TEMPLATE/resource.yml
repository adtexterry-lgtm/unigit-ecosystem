name: Recommend a resource
description: Recommend a model, MCP server, tool, skill, template, or knowledge resource for UNIGIT to review
title: "[Resource] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the recommendation. Submit public information only. Never include credentials, customer data, production endpoints, or unauthorized material.
  - type: dropdown
    id: category
    attributes:
      label: Resource type
      options:
        - Model or inference resource
        - MCP server or tool
        - Skill or work template
        - Knowledge resource or data connector
        - Domain capability
        - Other
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Resource name
      placeholder: Public name
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Official source
      description: Official website, documentation, or repository URL
      placeholder: https://
    validations:
      required: true
  - type: input
    id: license
    attributes:
      label: License or terms of use
      description: Write "Unknown" when the answer is not documented; do not guess
      placeholder: MIT / Apache-2.0 / Commercial / Unknown
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: What real work can it help users complete?
      description: Describe task value, not only feature names
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Maintenance and reliability evidence
      description: Include version, update date, maintainer, real usage evidence, or known limitations when available
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Installation, permissions, and security
      description: Note required permissions, external binary downloads, network access, or user-file access
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This Issue contains no credentials, personal information, customer data, or unauthorized material
          required: true
        - label: I provided a publicly verifiable source and marked undocumented facts as unknown
          required: true
