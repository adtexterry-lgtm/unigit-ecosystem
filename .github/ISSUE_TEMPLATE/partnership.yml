name: Propose a partnership
description: For model, capability, industry, content, channel, and commercial partners
title: "[Partnership] "
body:
  - type: markdown
    attributes:
      value: |
        Start with a secret-free public summary. Do not post contracts, pricing, account information, or technical credentials in a public Issue.
  - type: dropdown
    id: category
    attributes:
      label: Partnership area
      options:
        - Models or infrastructure
        - MCP, tools, or capability development
        - Industry knowledge or content
        - Channels, partners, or marketing
        - Ecosystem co-creation
        - Other
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: Person or organization
    validations:
      required: true
  - type: input
    id: public_link
    attributes:
      label: Publicly verifiable link
      description: Website, product page, portfolio, or official profile
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Partnership idea
      description: What can you contribute, and which users could we create value for together?
    validations:
      required: true
  - type: textarea
    id: next_step
    attributes:
      label: Suggested next step
      description: Do not include private contact details, contracts, pricing, or access credentials
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      options:
        - label: This Issue contains public information only and includes no secrets, personal information, or customer data
          required: true
