<svg width="1200" height="460" viewBox="0 0 1200 460" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">UNIGIT OS</title>
  <desc id="desc">AI should work for everyone</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="24" x2="1160" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070910"/>
      <stop offset="0.46" stop-color="#0B0914"/>
      <stop offset="1" stop-color="#160A2B"/>
    </linearGradient>
    <radialGradient id="violet-field" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1018 66) rotate(131) scale(510 382)">
      <stop stop-color="#7A32FF" stop-opacity="0.48"/>
      <stop offset="0.48" stop-color="#4D1DB2" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4D1DB2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ember-field" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(112 474) rotate(-49) scale(388 288)">
      <stop stop-color="#FF6A1F" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF6A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="650" y1="80" x2="1154" y2="406" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8024"/>
      <stop offset="0.43" stop-color="#FF315F"/>
      <stop offset="1" stop-color="#7C3FFF"/>
    </linearGradient>
    <linearGradient id="accent-line" x1="64" y1="0" x2="206" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF8326"/>
      <stop offset="0.52" stop-color="#FF315F"/>
      <stop offset="1" stop-color="#8646FF"/>
    </linearGradient>
    <filter id="brand-blur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="mascot-shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#210029" flood-opacity="0.72"/>
    </filter>
    <clipPath id="canvas-clip">
      <rect width="1200" height="460"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas-clip)">
    <rect width="1200" height="460" fill="url(#background)"/>
    <rect width="1200" height="460" fill="url(#violet-field)"/>
    <rect width="1200" height="460" fill="url(#ember-field)"/>

    <path d="M638 15C818 35 1054 132 1226 344" stroke="url(#spectrum)" stroke-width="108" stroke-linecap="round" opacity="0.07"/>
    <path d="M696 14C884 56 1061 164 1218 347" stroke="url(#spectrum)" stroke-width="2.5" stroke-linecap="round" opacity="0.62"/>
    <path d="M744 33C916 75 1069 177 1198 334" stroke="#E6D9FF" stroke-width="1" stroke-linecap="round" opacity="0.12"/>
    <circle cx="923" cy="246" r="199" fill="#FF315F" fill-opacity="0.15" filter="url(#brand-blur)"/>
    <circle cx="1066" cy="122" r="154" fill="#7040FF" fill-opacity="0.22" filter="url(#brand-blur)"/>

    <image x="64" y="34" width="252" height="67" href="unigit-wordmark.png" preserveAspectRatio="xMinYMid meet"/>

    <text x="64" y="215" fill="#F8F7FC" font-family="Bahnschrift, Aptos Display, Segoe UI, sans-serif" font-size="61" font-weight="700" letter-spacing="-1.6">AI SHOULD WORK</text>
    <text x="64" y="280" fill="#F8F7FC" font-family="Bahnschrift, Aptos Display, Segoe UI, sans-serif" font-size="61" font-weight="700" letter-spacing="-1.6">FOR EVERYONE.</text>
    <rect x="64" y="309" width="142" height="4" rx="2" fill="url(#accent-line)"/>
    <text x="64" y="354" fill="#C2BBD0" font-family="Aptos, Inter, Segoe UI, sans-serif" font-size="18" letter-spacing="0.1">Models · Tools · Files · Project Context</text>
    <text x="64" y="383" fill="#898297" font-family="Aptos, Inter, Segoe UI, sans-serif" font-size="16">One clear workbench for real results.</text>

    <g opacity="0.9">
      <circle cx="64" cy="423" r="3.5" fill="#FF7C24"/>
      <circle cx="81" cy="423" r="3.5" fill="#FF315F"/>
      <circle cx="98" cy="423" r="3.5" fill="#8444FF"/>
    </g>

    <image x="748" y="23" width="430" height="430" href="unigit-fireball-3d.png" preserveAspectRatio="xMidYMid meet" filter="url(#mascot-shadow)"/>
  </g>
</svg>
