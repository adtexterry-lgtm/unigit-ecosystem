name: 提出合作意向
description: 面向模型、能力、行业、内容、渠道与商业合作伙伴
title: "[Partnership] "
body:
  - type: markdown
    attributes:
      value: |
        请先提供不含秘密的合作概述。合同、报价、账号与技术凭据不要放在公开 Issue 中。
  - type: dropdown
    id: category
    attributes:
      label: 合作方向
      options:
        - 模型或基础设施
        - MCP、工具或能力开发
        - 行业知识或内容
        - 渠道、代理或市场
        - 生态共创
        - 其他
    validations:
      required: true
  - type: input
    id: organization
    attributes:
      label: 个人或组织名称
    validations:
      required: true
  - type: input
    id: public_link
    attributes:
      label: 可公开核对的链接
      description: 官网、产品页、作品集或官方主页
      placeholder: https://
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 合作设想
      description: 你能提供什么，希望共同为哪类用户创造什么价值
    validations:
      required: true
  - type: textarea
    id: next_step
    attributes:
      label: 建议的下一步
      description: 请勿在此填写私人联系方式、合同、报价或访问凭据
    validations:
      required: true
  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 本 Issue 只包含可公开信息，不含秘密、个人信息或客户数据
          required: true
